{% extends "base.html" %}
{% load widget_tweaks %}

{% block title %}Sign In{% endblock %}

{% block content %}
<div class="bg-white shadow-md rounded-lg max-w-md w-full p-8">
    <h2 class="text-2xl font-bold text-center mb-6">Login</h2>

    <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <div class="mb-6">
            <label for="username" class="block text-blue-700">Username</label>
            <input type="text" name="username" id="username"
                   class="w-full px-4 py-2 border border-gray-400 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                   placeholder="Enter your username">
        </div>

        <div class="mb-6">
            <label for="password" class="block text-blue-700">Password</label>
            <input type="password" name="password" id="password"
                   class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                   placeholder="Enter your password">
        </div>

        <button type="submit"
                class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition duration-200">
            Sign In
        </button>
    </form>

    <p class="mt-4 text-sm text-center text-gray-600">
        Don't have an account?
        <a href="{% url 'register' %}" class="text-blue-500 hover:underline">Register here</a>
    </p>
</div>
{% endblock %}
