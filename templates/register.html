{% load static%}

<!DOCTYPE html>
<html lan="en">
    <head>
        <title>Register</title>
        <script scr="https://cdn.tailwindcss.com"></script>
    </head>

<body class=" bg-blue-600 flex items-center justify-center min-h-screen">
    <div class="bg-gray-100 rounded shadow-md w-full max-w-md">
        <h2 class="text-center font-bold mb-6 text-blue-center ">Register</h2>

        {% if message % }
            {% for message in messages %}
                <p class="text-red-500 text-center">{{ message}}</p>
            {% endfor %}
         {% endif%}

         <form method="post" action="{% url 'register' %}">
            {% csrf_token %}

            <input type="text" name="username" placeholder="Username" class="w-full mb-4 px-4 py-2 border rounded">
            <input type="email" name="email" placeholder="Email" class="w-full mb-4 px-4 py-2 border rounded">
            <input type="password" name="password" placeholder="Password" class="w-full mb-4 px-4 py-2 border rounded">
            <input type="password" name="confirm_password" placeholder="confirm_password" class="w-full mb-4 px-4 py-2 border rounded">
            
            <button type="Submit" class="w-full bg-blue-600 text-white py-2 rounded-lg">Register</button>
        
         </form>
         <p class="text-center mt-4 text-sm">Aready have an account? <a href="{% url 'login' %} class="text-blue-700>Login</a></p>

    </div>
</body>

</body>
</html>
