
{% load socialaccount %}


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .fade-in {
      animation: fadeIn 1s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-gray-400 flex items-center justify-center min-h-screen px-4">

  <div class="w-full max-w-md bg-white shadow-xl rounded-lg p-8 fade-in">
    <!-- Logo -->
    <div class="flex justify-center mb-4">
      <img src="https://mam-laka.com/assets/logo-DC45--dO.png" alt="Logo" class="h-14">
    </div>

    <h2 class="text-3xl font-bold text-center text-blue-600 mb-6">Login</h2>

    <!-- Google Login Button -->
   <a href="{% provider_login_url 'google' %}">

    <button class="w-full flex items-center justify-center gap-2 bg-white border border-gray-300 text-gray-700 py-2 rounded-md hover:bg-gray-100 mb-6">
      <img src="https://upload.wikimedia.org/wikipedia/commons/4/4a/Logo_2013_Google.png" alt="Google" class="h-8 text-lg">
      Sign in with Google
 
    </button>
  </a>
    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}

      <!-- Username 
      <div class="mb-5">
        <label for="username" class="block text-lg font-medium text-gray-700 mb-2">Username</label>
        <input type="text" name="username" id="username" required
               class="w-full px-4 py-3 text-lg border border-gray-400 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
               placeholder="Enter your username">
      </div> -->

      <!-- Email -->
      <div class="mb-5">
        <label for="email" class="block text-lg font-medium text-gray-700 mb-2">Email</label>
        <input type="email" name="email" id="email" required
               class="w-full px-4 py-3 text-lg border border-gray-400 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
               placeholder="Enter your email">
      </div>

  <!-- Password -->
<div class="mb-6">
  <label for="password" class="block text-lg font-medium text-gray-700 mb-2">Password</label>
  
  <div class="relative">
    <input type="password" name="password" id="password"
           class="w-full px-4 py-3 text-lg border border-gray-400 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
           placeholder="Enter your password">
  </div>

  <!-- Checkbox for Show Password -->
  <div class="flex items-center mt-2">
    <input type="checkbox" id="showPassword" onclick="togglePassword()"
           class="mr-2 w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500">
    <label for="showPassword" class="text-sm text-gray-700 flex items-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 mr-1 text-gray-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
      Show Password
    </label>
  </div>
</div>

<!-- Password Toggle Script -->
<script>
  function togglePassword() {
    const passwordInput = document.getElementById("password");
    const checkbox = document.getElementById("showPassword");
    passwordInput.type = checkbox.checked ? "text" : "password";
  }
</script>



      <!-- Submit -->
      <button type="submit"
              class="w-full bg-blue-600 text-white py-3 text-lg rounded-md hover:bg-blue-700 transition duration-200">
        Sign In
      </button>
    </form>

    <p class="mt-6 text-center text-gray-700">
      Don't have an account?
      <a href="{% url 'register' %}" class="text-blue-600 font-medium hover:underline">Register here</a>
    </p>
  </div>

</body>
</html>
