{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-600 flex items-center justify-center min-h-screen px-4">

  <div class="bg-gray-100 rounded-xl p-8 py-16 w-full max-w-md mt-12 shadow-lg">
    <h2 class="text-3xl font-bold text-center text-blue-600 mb-8">Sign Up</h2>

    {% if messages %}
      <div class="mb-6">
        {% for message in messages %}
          <p class="text-red-600 text-sm text-center">{{ message }}</p>
        {% endfor %}
      </div>
    {% endif %}

    <form method="post" action="{% url 'register' %}" class="space-y-12">
      {% csrf_token %}

      <!-- Username -->
      <div class="relative">
        <input type="text" name="username" placeholder="Username" required
          class="w-full px-4 py-3 text-lg border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition" />
        <span class="absolute right-4 top-3.5 text-gray-400 select-none">👤</span>
      </div>

      <!-- Email -->
      <div class="relative">
        <input type="email" name="email" placeholder="Email" required
          class="w-full px-4 py-3 text-lg border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition" />
        <span class="absolute right-4 top-3.5 text-gray-400 select-none">📧</span>
      </div>

      <!-- Password -->
      <div class="relative">
        <input type="password" name="password" placeholder="Password" required
          class="w-full px-4 py-3 text-lg border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition" />
        <span class="absolute right-4 top-3.5 text-gray-400 select-none">🔒</span>
      </div>

      <!-- Confirm Password -->
      <div class="relative">
        <input type="password" name="confirm_password" placeholder="Confirm Password" required
          class="w-full px-4 py-3 text-lg border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition" />
        <span class="absolute right-4 top-3.5 text-gray-400 select-none">🔒</span>
      </div>

      <button type="submit"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition duration-200 shadow-md hover:shadow-lg">
        Register
      </button>
    </form>

    <p class="text-sm text-center text-gray-700 mt-8">
      Already have an account? 
      <a href="{% url 'login' %}" class="text-blue-600 hover:underline">Login</a>
    </p>
  </div>

</body>
</html>
